<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- Tints the status bar to match the app's own background so it blends
         in. (It does not reach the Android navigation bar of an installed
         PWA — that comes from manifest.json, baked in at install time.)
         These OS-preference-based values are the first-paint fallback;
         ThemeProvider (theme.ts) overrides both tags live from then on, to
         track the actually resolved theme (including a manual override that
         differs from the OS setting), not just the OS default. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFAFA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181314" />

    <!-- Add to Home Screen (PWA) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ping Pong" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height. `100%` is a fallback for
         browsers that don't understand `100dvh` (dynamic viewport height) —
         on mobile, `100%`/`100vh` can resolve shorter than the true visible
         area (e.g. around on-screen gesture-nav), leaving a gap *below*
         `</html>` itself that no background-color on html/body can reach,
         since it's outside the document entirely. `dvh` tracks the real
         visible viewport instead. */
      html,
      body {
        height: 100%;
        height: 100dvh;
      }
      /* Matches the app's `background` token for each theme, so the system
         safe-area (e.g. below the tab bar, behind on-screen gesture nav)
         isn't the browser's default white before/around the app content.
         ThemeProvider overrides this live once a user picks dark/light
         explicitly, overriding the OS default. */
      html,
      body {
        background-color: #FAFAFA;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #181314;
        }
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* Prevent iOS Safari's text-selection magnifier/callout from popping
         up on a press-and-hold of a button, tab, or chip — form fields are
         excluded so typing/editing still works normally. */
      body {
        -webkit-user-select: none;
        user-select: none;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      /* Crisper text rendering on WebKit. */
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>

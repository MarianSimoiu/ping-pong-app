name: Deploy Supabase

# Vercel deploys the app on every merge, but the Supabase side (database
# migrations + Edge Functions) needs the Supabase CLI. This runs it from
# GitHub instead, so no local setup is needed. Runs on merges that touch
# supabase/, or manually from the Actions tab.
on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy migrations and Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: fdugzpsuznitvqwnrtim
    steps:
      - name: Check secrets
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings → Secrets and variables → Actions)."
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/supabase-cli" --no-audit --no-fund supabase@2.121.0
          echo "$RUNNER_TEMP/supabase-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD" --yes

      - name: Show migration status
        continue-on-error: true
        run: supabase migration list --linked -p "$SUPABASE_DB_PASSWORD"

      # Migrations go first: the current functions store match lengths
      # (e.g. 2 or 4 games) that only the newest database rule allows.
      - name: Push database migrations
        run: supabase db push --linked -p "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
